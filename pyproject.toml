readme = "README.md"
authors = [
    { name = "1nder", email = "20195347+1nderr@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pynput>=1.7.6",
    "pyside6>=6.5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10.0",
]
